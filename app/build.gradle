plugins {
    id 'com.android.application'
}

android {
    namespace 'app.quietvolume'
    compileSdk 35

    defaultConfig {
        applicationId 'app.quietvolume'
        minSdk 28          // Android 9 or newer
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Release key: keystore.properties + release.jks in the project folder (not in git).
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        def ks = new Properties()
        keystoreFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the built-in Android framework.
