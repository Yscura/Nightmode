plugins {
    id 'com.android.application'
}

android {
    namespace 'app.quietvolume'
    compileSdk 35

    defaultConfig {
        applicationId 'app.quietvolume'
        minSdk 28          // Android 9 or newer
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app uses only the built-in Android framework.
